services:
  vs-agent:
    build: 
      context: ../..
      dockerfile: ./apps/vs-agent/Dockerfile
      target: vs-agent-mrtd
    image: vs-agent
    container_name: verifier-vs-agent
    restart: always
    networks:
      - verifier
    ports:
      - 3000:3000
      - 3001:3001
    environment:
      # The agent derives its did:webvh and its wss:// DIDComm endpoint from this, so it needs a
      # public https host in front of port 3001, as the chatbot example does.
      - PUBLIC_API_BASE_URL=https://ngrok-free.app
      - USE_CORS=true
      - EVENTS_WEBHOOK_URL=http://verifier-backend:5100/events
    volumes:
      - ./afj:/root/.afj

  verifier-backend:
    build: 
      context: ../..
      dockerfile: ./examples/verifier/Dockerfile
    image: vs-agent-verifier
    container_name: verifier-backend
    restart: always
    networks:
      - verifier
    ports:
      - 5100:5100
    environment:
      - PORT=5100
      - VS_AGENT_ADMIN_BASE_URL=http://verifier-vs-agent:3000
      - PUBLIC_BASE_URL=http://10.82.14.12:5100

networks:
  verifier:
