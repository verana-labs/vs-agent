# Service deployment for chatbot application
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
  - name: backend
    port: {{ .Values.env.port | default 5000 }} # Port exposed by the service
    targetPort: {{ .Values.env.port | default 5000 }} # Port on the container to which the service routes traffic
    protocol: TCP    
---
# Ingress resource for chatbot application
# This resource defines how external traffic can access the chatbot service
# routes traffic to the backend service
{{- $routeType := .Values.ingress.type | default "ingress" }}
{{- if not (has $routeType (list "ingress" "gateway")) }}
{{- fail (printf "ingress.type must be ingress or gateway, not %q" $routeType) }}
{{- end }}
{{- if eq $routeType "gateway" }}
{{- $gw := .Values.ingress.gateway | default dict }}
# Gateway API route, for a cluster served by a Gateway instead of ingress-nginx.
# The Gateway listener named here terminates TLS, so ingress.tlsSecret takes no
# part in this mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is needed when ingress.type is gateway" $gw.name }}
      {{- with $gw.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ tpl .Values.ingress.host . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.env.port | default 5000 }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ tpl .Values.ingress.host . }}
      secretName: {{ tpl .Values.ingress.tlsSecret . }}
  rules:
    - host: {{ tpl .Values.ingress.host . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                 name: {{ .Values.name }}
                 port:
                   number: {{ .Values.env.port | default 5000 }} # Port on the service to which the ingress routes traffic
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
   name: {{ .Values.name }}
   namespace: {{ .Release.Namespace }}
spec:
   serviceName: {{ .Values.name }}
   replicas: {{ default 1 .Values.replicas }}
   selector:
      matchLabels:
         app: {{ .Values.name }}
   template:
      metadata:
         labels:
            app: {{ .Values.name }}
      spec:
         containers:
         -  name: {{ .Values.name }}-backend-container
            image: {{ .Values.image.repository | default "veranalabs/vs-agent-demo-chatbot-backend" }}:{{ .Values.image.tag | default .Chart.Version }}
            imagePullPolicy: Always
            env:
            # Base URL for the Agent Admin API
            - name: VS_AGENT_ADMIN_BASE_URL
              value: "{{ .Values.env.vsAgentAdminUrl }}"
            {{- if .Values.env.jsonSchemaCredentialId }}
            # VTJSC of the phoneNumber schema, the bot finds or creates its credential definition on startup
            - name: JSON_SCHEMA_CREDENTIAL_ID
              value: {{ .Values.env.jsonSchemaCredentialId | quote }}
            {{- end }}
            # Base URL for the Service API
            - name: PUBLIC_BASE_URL
              value: "https://{{ tpl .Values.ingress.host . }}"
            # Base URL for the Vision Service
            - name: VISION_SERVICE_BASE_URL
              value: "{{ tpl .Values.env.visionUrl . }}"
            # Base URL for the WebRTC server
            - name: WEBRTC_SERVER_BASE_URL
              value: "{{ tpl .Values.env.webrtcUrl . }}"
            ports:
            -  containerPort: {{ .Values.env.port | default 5000 }}
            {{- if .Values.resources }}
            resources:
{{- toYaml .Values.resources | nindent 14 }}
            {{- end }}

