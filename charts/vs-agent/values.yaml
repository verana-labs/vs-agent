# Global configuration for the application
global: 
  domain: example.io # Domain for the application

# General configuration
name: vs-agent
replicas: 1 # Number of replicas for the VS Agent service

# Ports
adminPort: 3000 # adminPort is the port for the Agent Admin API
didcommPort: 3001 # Port for DIDComm

# Admin API authentication
adminApiAuthMode: "internal" # Single value: internal (403 for every external request) or corporation (external callers with ADR-036 auth + allowlist)
adminApiPublicUrl: "" # Public https origin where external callers reach the Admin API, required when adminApiAuthMode is corporation (e.g. "https://admin.{{ .Values.global.domain }}")
adminApiTrustedNetworks: "" # Comma-separated CIDR blocks served without authentication (default 127.0.0.0/8,::1/128). Keep public proxy/ingress source addresses OUT of these blocks
adminApiCorporationAllowedAccounts: "" # Comma-separated allowlist of Verana account addresses, required non-empty when adminApiAuthMode is corporation

# Agent configuration
didcommLabel: "VS Agent"
eventsBaseUrl: "https://events.{{ .Values.global.domain }}"
didcommInvitationImageUrl: "https://image.{{ .Values.global.domain }}/invitation.png"
# enablePublicApiSwagger: true # Enable Swagger documentation for the VS Agent service (its recommended only for development environments)
publicDidMethod: "webvh"

# Verana network. The agent refuses to start without the first three, and without
# VERANA_ACCOUNT_MNEMONIC (see "Secrets Management" in the README).
veranaCorporationId: "" # VPR Corporation.id the agent belongs to (non-negative integer)
veranaRpcEndpointUrl: "" # e.g. "https://rpc.testnet.verana.network"
veranaIndexerBaseUrl: "" # e.g. "https://idx.testnet.verana.network"
veranaChainId: "" # Required for the VS-CONN-VS trust gate

# How the agent obtains its ECS credentials: standalone (default) or delegated
agentMode: "standalone"
trustedEcsEcosystemDids: "" # Comma-separated ECS ecosystem DIDs, required when agentMode is standalone
delegatedParentVsDid: "" # DID of the parent Verifiable Service, required when agentMode is delegated

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

image:
  repository: ""
  tag: ""

# DB and Redis configuration
database:
  enabled: false
  existingSecret: ""   # name of a pre-existing Secret containing POSTGRES_PASSWORD
  secretPwdKey: ""     # key name for POSTGRES_PASSWORD in the secret (default: POSTGRES_PASSWORD)
  user: ""             # plain value, injected directly
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: false
  image: "redis:alpine"      # Redis container image (pin a tag for reproducible deploys)
  maxmemory: "80mb"          # Redis memory cap; set "" for unlimited (Redis default)
  maxmemoryPolicy: noeviction # applied only when maxmemory is set
  extraArgs: []              # additional redis-server flags, e.g. ["--save", ""]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Enable cors for the VS Agent
ingress:
  host: "{{ .Values.name }}.{{ .Values.global.domain }}"
  tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert
  public:
    enableCors: true
  # The agent reads the address of each TCP connection. The ingress controller has an
  # external address. Therefore, the agent rejects these requests with the HTTP status
  # 403 if adminApiAuthMode is "internal".
  # Set adminApiAuthMode to "corporation" before you set a host here.
  private:
    enableCors: true
    whitelistSourceRange: "" # e.g. "xxx.xx.xxx.xxx/32"
    tlsSecret: "private.{{ .Values.name }}.{{ .Values.global.domain }}-cert"
    host: ""

# Extra environment variables (extensible)
extraEnv: []

# Persistent volume configuration for app
storage:
  size: 1Gi
  storageClassName: csi-cinder-high-speed
